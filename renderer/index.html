<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';" />
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <header class="titlebar">
      <div class="phase">
        <span class="phase-label" id="phaseLabel">专注</span>
        <span class="dots" id="sessionCount"></span>
      </div>
      <div class="window-controls">
        <button class="wbtn" id="btnPin" title="置顶">📌</button>
        <button class="wbtn" id="btnMin" title="最小化">─</button>
        <button class="wbtn wclose" id="btnClose" title="退出">✕</button>
      </div>
    </header>

    <main class="dial">
      <div class="ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"></circle>
        </svg>
        <div class="time-box">
          <div class="time" id="time">25:00</div>
          <div class="hint" id="hint">准备开始</div>
        </div>
      </div>
    </main>

    <div class="actions">
      <button class="abtn ghost" id="btnReset" title="重置">↺</button>
      <button class="abtn primary" id="btnStart">开始</button>
      <button class="abtn ghost" id="btnSkip" title="跳过">⏭</button>
    </div>

    <footer class="foot">
      <button class="settings-btn" id="btnSettings">⚙ 设置</button>
    </footer>
  </div>

  <div class="overlay hidden" id="settingsPanel">
    <div class="sheet">
      <h2>设置</h2>
      <div class="field">
        <label>专注时长（分钟）</label>
        <input type="number" id="inWork" min="1" max="120" />
      </div>
      <div class="field">
        <label>短休息（分钟）</label>
        <input type="number" id="inShort" min="1" max="60" />
      </div>
      <div class="field">
        <label>长休息（分钟）</label>
        <input type="number" id="inLong" min="1" max="90" />
      </div>
      <div class="field">
        <label>每几个番茄后长休息</label>
        <input type="number" id="inEvery" min="2" max="8" />
      </div>
      <div class="field row">
        <label>自动开始休息</label>
        <label class="switch"><input type="checkbox" id="swAutoBreak" /><span class="slider"></span></label>
      </div>
      <div class="field row">
        <label>自动开始专注</label>
        <label class="switch"><input type="checkbox" id="swAutoWork" /><span class="slider"></span></label>
      </div>
      <div class="field row">
        <label>提示音</label>
        <label class="switch"><input type="checkbox" id="swSound" /><span class="slider"></span></label>
      </div>
      <div class="field row">
        <label>系统通知</label>
        <label class="switch"><input type="checkbox" id="swNotify" /><span class="slider"></span></label>
      </div>
      <div class="sheet-actions">
        <button class="abtn ghost" id="btnCancel">取消</button>
        <button class="abtn primary" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
